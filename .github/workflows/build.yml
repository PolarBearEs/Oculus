name: Build Oculus Stacia DH compatibility

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build Forge jar
        run: bash ./gradlew remapJar --console=plain
      - name: Check Euphoria version glyph formatting
        run: |
          mkdir -p "$RUNNER_TEMP/glyph-tests"
          javac -d "$RUNNER_TEMP/glyph-tests" src/main/java/net/coderbot/iris/gl/shader/EuphoriaVersionGlyphs.java tests/EuphoriaVersionGlyphsTest.java
          java -cp "$RUNNER_TEMP/glyph-tests" net.coderbot.iris.gl.shader.EuphoriaVersionGlyphsTest
      - uses: actions/upload-artifact@v4
        with:
          name: oculus-stacia-dh3
          path: build/libs/*.jar
          if-no-files-found: error
